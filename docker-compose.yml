services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=bozgi
      - DB_PASSWORD=hujgnuj
      - DB_NAME=db
  mysql:
    image: mysql:latest
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=hujgnuj
      - MYSQL_DATABASE=db
      - MYSQL_USER=bozgi
      - MYSQL_PASSWORD=hujgnuj
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=bozgi
      - PMA_PASSWORD=hujgnuj

volumes:
  mysql_data: